    <script>
      // Apply the preference before paint; storage may be unavailable in private browsing.
      try {
        const saved = localStorage.getItem('pl-theme')
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.motion =
          localStorage.getItem('pl-motion') === 'paused' ? 'paused' : 'running'
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'dark'
      }
    </script>
